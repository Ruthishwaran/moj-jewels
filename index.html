<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/moj_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOJ Jewels | Wholesale & Retail Luxury Jewelry</title>
    <meta name="description" content="Shop handcrafted gold, bridal & antique imitation jewelry at MOJ Jewels." />
    
    <!-- PWA meta tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c5a059" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MOJ Jewels" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Unregister stale service worker cache on localhost -->
    <script>
      if ('serviceWorker' in navigator && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
            console.log('Unregistered stale local service worker cache.');
          }
        });
      }
    </script>
  </head>
  <body class="bg-[#0b0f19] text-slate-100 font-sans antialiased selection:bg-gold-500 selection:text-black min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
